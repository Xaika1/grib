services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grib
      POSTGRES_USER: grib
      POSTGRES_PASSWORD: ${GRIB_DB_PASSWORD:-grib}
    volumes:
      - grib-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grib -d grib"]
      interval: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      GRIB_DATABASE_URL: postgresql+psycopg://grib:${GRIB_DB_PASSWORD:-grib}@db/grib
      GRIB_SECRET_KEY: ${GRIB_SECRET_KEY:-change-me-please-to-a-long-random-string}
      GRIB_ADMIN_LOGIN: ${GRIB_ADMIN_LOGIN:-admin}
      GRIB_ADMIN_PASSWORD: ${GRIB_ADMIN_PASSWORD:-admin}
    volumes:
      - ./demo/data:/data:ro
    ports:
      - "8000:8000"
    restart: unless-stopped

  demo-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    volumes:
      - ./demo/init_pg.sql:/docker-entrypoint-initdb.d/01-reader.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 3s
      retries: 20

  demo-generator:
    build: ./demo
    depends_on:
      demo-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  grib-db:
